server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/comprehensive_evaluation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cesd:
  jwt:
    secret: ${JWT_SECRET:3sK9zX7pQ2rT5yU8aFgHjKlZxCvBnMqWsEdR1tY4uI6oP}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  upload:
    root-dir: ${CESD_UPLOAD_ROOT:./uploads}
    max-file-size: ${CESD_UPLOAD_MAX_FILE_SIZE:10485760}
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - pdf
      - doc
      - docx
    access-url-prefix: /api/material-attachments

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.hjc.backend: debug
